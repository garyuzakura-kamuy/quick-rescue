<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クイックレスキュー</title>

  <!-- PWA基本設定 -->
  <meta name="theme-color" content="#121214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="レスキュー">

  <!-- アイコンデータ -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚑</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚑</text></svg>">

  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1E1E24;
      --text-main: #FFFFFF;
      --text-sub: #A0A0AB;
      --border-color: #2D2D35;
      --accent-color: #1976D2;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
    }

    /* ヘッダー */
    .header {
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 22px;
      margin: 0 0 4px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header p {
      font-size: 13px;
      color: var(--text-sub);
      margin: 0;
    }

    /* URL表示エリア */
    .url-display {
      background: #18181C;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 16px;
      font-family: monospace;
      font-size: 11px;
      color: #82B1FF;
      white-space: nowrap;
      overflow-x: auto;
    }

    /* 緊急連絡エリア */
    .emergency-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .emergency-btn {
      flex: 1;
      background: #D32F2F;
      color: white;
      text-decoration: none;
      padding: 10px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: bold;
      font-size: 13px;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
    }

    .emergency-btn.doc {
      background: #1976D2;
      box-shadow: 0 4px 12px rgba(25, 118, 210, 0.3);
    }

    /* 2×2 グリッドレイアウト */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .rescue-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 105px;
      cursor: pointer;
      box-sizing: border-box;
    }

    .card-icon { font-size: 24px; margin-bottom: 4px; }
    .card-title { font-size: 13px; font-weight: bold; }
    .card-tag { font-size: 10px; color: var(--text-sub); margin-top: 2px; }

    .card-1 { border-top: 3px solid #FF5252; }
    .card-2 { border-top: 3px solid #FFA000; }
    .card-3 { border-top: 3px solid #29B6F6; }
    .card-4 { border-top: 3px solid #26A69A; }

    /* AIチャットセクション */
    .chat-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin-top: 10px;
    }

    .chat-header {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #90CAF9;
    }

    .chat-box {
      background: #121214;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      height: 200px;
      padding: 12px;
      overflow-y: auto;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.ai {
      background: #252530;
      color: #ECEFF1;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .message.user {
      background: #1565C0;
      color: #FFFFFF;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .chat-input-area {
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      background: #121214;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 10px 14px;
      color: white;
      font-size: 13px;
      outline: none;
    }

    .chat-send-btn {
      background: var(--accent-color);
      border: none;
      color: white;
      border-radius: 20px;
      padding: 0 16px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
    }

    .bottom-sheet {
      background: #1C1C22;
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      border-top: 1px solid var(--border-color);
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .sheet-title { font-size: 16px; font-weight: bold; }

    .close-btn {
      background: #2D2D35;
      border: none;
      color: var(--text-main);
      font-size: 16px;
      width: 30px; height: 30px;
      border-radius: 50%;
      cursor: pointer;
    }

    .sheet-body { font-size: 13px; line-height: 1.6; color: #E0E0E0; }
    .sheet-body ul { margin: 0 0 10px 0; padding-left: 18px; }
    .sheet-body li { margin-bottom: 4px; }
    .sheet-body .section-title { font-size: 14px; font-weight: bold; color: #FFD54F; margin: 12px 0 4px 0; display: block; }
    .sheet-body .note-text { font-size: 11px; color: #A0A0AB; background: #25252D; padding: 8px; border-radius: 6px; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h1>クイックレスキュー 🚑</h1>
      <p>いま必要なサポートボタンをタップしてください</p>
    </div>

    <div class="url-display">
      https://quick-rescue-tau.vercel.app
    </div>

    <!-- 緊急発信エリア -->
    <div class="emergency-bar">
      <a href="tel:119" class="emergency-btn"><span>📞</span> 119番通報</a>
      <a href="tel:#7119" class="emergency-btn doc"><span>🏥</span> #7119 (相談)</a>
    </div>

    <!-- 2x2 グリッドボタン -->
    <div class="grid-container">
      <div class="rescue-card card-1" onclick="openModal('card1')">
        <div class="card-icon">🚨</div>
        <div>
          <div class="card-title">頭痛・倦怠感</div>
          <div class="card-tag">透析・糖尿病向け</div>
        </div>
      </div>

      <div class="rescue-card card-2" onclick="openModal('card2')">
        <div class="card-icon">🍫</div>
        <div>
          <div class="card-title">甘いものが食べたい</div>
          <div class="card-tag">糖尿病・透析向け</div>
        </div>
      </div>

      <div class="rescue-card card-3" onclick="openModal('card3')">
        <div class="card-icon">💧</div>
        <div>
          <div class="card-title">透析後のケア</div>
          <div class="card-tag">血液透析向け</div>
        </div>
      </div>

      <div class="rescue-card card-4" onclick="openModal('card4')">
        <div class="card-icon">✨</div>
        <div>
          <div class="card-title">未来の希望</div>
          <div class="card-tag">先進医療・治験</div>
        </div>
      </div>
    </div>

    <!-- AIチャットエリア -->
    <div class="chat-section">
      <div class="chat-header">
        <span>🤖</span> レスキュー対話AI（購入者専用）
      </div>
      <div class="chat-box" id="chatBox">
        <div class="message ai">
          こんにちは！クイックレスキューサポートAIです。体調の変化や気になること、何でも気軽に話しかけてくださいね。
        </div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="userInput" class="chat-input" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
        <button class="chat-send-btn" onclick="sendMessage()">送信</button>
      </div>
    </div>
  </div>

  <!-- モーダル -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
      <div class="sheet-header">
        <div class="sheet-title" id="modalTitle">レスキュー詳細</div>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="sheet-body" id="modalContent"></div>
    </div>
  </div>

  <script>
    const rescueData = {
      card1: {
        title: "🚨 頭痛・倦怠感がある",
        content: `
          <p><b>血液透析患者さんおよび糖尿病（2型・予備軍）の方</b>に向けたレスキュー案内です。</p>
          <span class="section-title">【生化学的な原因】</span>
          <ul>
            <li><b>血液透析の方:</b> 透析による脳と体液の浸透圧バランス低下や電解質変化が主な原因です。</li>
            <li><b>糖尿病・高血糖の方:</b> 高血糖に伴う浸透圧利尿による脱水や血糖値スパイクの反動が原因です。</li>
          </ul>
          <span class="section-title">【対応のアプローチ】</span>
          <ul>
            <li><b>こまめな水分補給:</b> 水やカフェインレスのお茶（麦茶等）を一口ずつ補給しましょう。</li>
            <li><b>幼児用経口補水液:</b> カリウム・ナトリウム控えめで安全でおすすめです。</li>
            <li><b>クエン酸の工夫:</b> 麦茶200mlに100%レモン果汁を小さじ半分加えると循環サポートになります。</li>
          </ul>
        `
      },
      card2: {
        title: "🍫 甘いものが食べたい",
        content: `
          <p>身体がエネルギー補給を求めている生化学的なSOSです。</p>
          <span class="section-title">【SGLT-1メカニズム活用】</span>
          <ul>
            <li>「微量な糖分 ＋ 微量の天然塩（ぬちまーす等）」で急激な食欲を穏やかに鎮めます。</li>
            <li>レモン果汁小さじ半分を水や茶に混ぜるとクエン酸が糖代謝をサポートします。</li>
          </ul>
        `
      },
      card3: {
        title: "💧 透析後のケアについて",
        content: `
          <p>透析後は微量元素（亜鉛や銅）が抜けやすい状態です。</p>
          <span class="section-title">【対応のアプローチ】</span>
          <ul>
            <li>粉ミルク等を活用した計画的な微量栄養素の補給が効果的です。</li>
            <li>嘔吐等で食事が摂れない非常時は、バーガーショップのメニュー（ポテト等）も迅速な電解質・エネルギー補充の選択肢となります。</li>
          </ul>
        `
      },
      card4: {
        title: "✨ 未来の希望（先進医療・治験データ）",
        content: `
          <span class="section-title">【最新の治験・研究データ】</span>
          <ul>
            <li><b>iPS細胞×膵島シート:</b> インスリン注射不要を目指す治験が進行中。</li>
            <li><b>自己幹細胞投与:</b> インスリン抵抗性の改善・寛解を目指す再生医療。</li>
            <li><b>iPS細胞×腎前駆細胞:</b> 腎機能維持・線維化抑制のヒト治験へ。</li>
            <li><b>装着型・埋め込み型人工腎臓（WAK/iAK）:</b> 2030年に向けた実用化ロードマップが進行中。</li>
          </ul>
        `
      }
    };

    function openModal(cardId) {
      const overlay = document.getElementById('modalOverlay');
      const title = document.getElementById('modalTitle');
      const content = document.getElementById('modalContent');
      if (rescueData[cardId]) {
        title.innerHTML = rescueData[cardId].title;
        content.innerHTML = rescueData[cardId].content;
        overlay.style.display = 'flex';
      }
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    function closeModalOnOverlay(event) {
      if (event.target.id === 'modalOverlay') closeModal();
    }

    /* AIチャット処理 */
    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      // AI返答の生成（知識ベースに基づく回答）
      setTimeout(() => {
        const reply = generateAIReply(text);
        addMessage(reply, 'ai');
      }, 600);
    }

    function addMessage(text, sender) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function generateAIReply(userText) {
      const lower = userText.toLowerCase();
      
      if (lower.includes('頭痛') || lower.includes('怠い') || lower.includes('だるい') || lower.includes('しんどい')) {
        return "頭痛や倦怠感ですね。透析や高血糖による水分・浸透圧の急激な変化が原因の場合があります。一口ずつカフェインレスのお茶や、カリウム控えめの幼児用経口補水液をゆっくり含んで飲んでみてください。レモン果汁を少量加えるのもおすすめです。";
      } else if (lower.includes('甘い') || lower.includes('食べたい') || lower.includes('腹減った') || lower.includes('空腹')) {
        return "甘いものを欲するのは体の生化学的なエネルギー要求（SOS）です！微量の糖分にぬちまーす等の天然塩を少量合わせることで、SGLT-1メカニズムを通じて効率よく吸収され、欲求が落ち着きやすくなりますよ。";
      } else if (lower.includes('透析') || lower.includes('吐き気') || lower.includes('吐く') || lower.includes('気持ち悪い')) {
        return "透析後は亜鉛などの微量元素が抜けやすく疲れが出やすいです。万が一食事を受け付けず吐いてしまう時は、無理な健康食よりジャンクなポテト等の塩分と単純炭水化物が緊急のエネルギー補給として役立つこともあります。";
      } else if (lower.includes('治験') || lower.includes('未来') || lower.includes('治る') || lower.includes('iPS')) {
        return "医療は確実に進歩しています！iPS細胞を用いた膵島シートの移植治験や、自己幹細胞投与によるインスリン抵抗性の改善、装着型・埋め込み型人工腎臓（WAK/iAK）など、2030年に向けた明るい選択肢がたくさん研究されています。";
      } else if (lower.includes('ありがとう') || lower.includes('感謝')) {
        return "どういたしまして！いつでも頼りにしてくださいね。無理せず体を大切に過ごしてください。";
      } else {
        return `「${userText}」についてのご相談ですね。体調に違和感がある時は、まずは落ち着いて水分（麦茶や水）を一口含み、深呼吸してみましょう。詳しい症状や気になることがあれば何でも教えてくださいね。`;
      }
    }
  </script>
</body>
</html>
